
# Name of the workflow shown in GitHub Actions
name: DevSecOps Pipeline


# Force GitHub Actions to use Node.js 24 (future-proof)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# Trigger the workflow on push or pull request
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:


# Define jobs
jobs:
  test:

    # Use a Linux virtual machine
    runs-on: ubuntu-latest

    steps:

    # Step 1: Checkout your repository
    - name: Checkout code
      uses: actions/checkout@v4

   
    - name: Show commit information
      run: |
        echo "Triggered by: ${{ github.actor }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"

    
    # Scan for secrets in code
    - name: Scan for secrets (Gitleaks)
      uses: gitleaks/gitleaks-action@v2



    # Step 2: Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Step 3: Install dependencies
    - name: Install dependencies
      run: pip install -r requirements.txt

      
    # Lint code (static code analysis)
    - name: Run linting (flake8)
      run: |
        # Fail on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

        # Report warnings (does not fail pipeline)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


    # Step 4: Run tests
    - name: Run tests
      run: pytest



  #  Job 2: Code scanning (SAST)
  codeql:

    name: CodeQL Analysis

    runs-on: ubuntu-latest

    steps:

    # Step 1: Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Initialize CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python

    # Step 3: Install dependencies
    - name: Install dependencies
      run: pip install -r requirements.txt

    # Step 4: Run CodeQL analysis
    - name: Analyze code
      uses: github/codeql-action/analyze@v3

