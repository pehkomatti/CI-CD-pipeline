name: DevSecOps Pipeline

# Define minimal permissions (principle of least privilege)
permissions:
  contents: read
  security-events: write

# Force GitHub Actions to use Node.js 24 (future-proof)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Trigger the workflow
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:


jobs:


  # Job 1: CI + Security Checks
  test:
    name: CI and Security Checks
    runs-on: ubuntu-latest

    steps:

    # Checkout repository with full history
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Show execution context
    - name: Show commit information
      run: |
        echo "Triggered by: ${{ github.actor }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"

    # Secret scanning
    - name: Scan for secrets (Gitleaks)
      uses: gitleaks/gitleaks-action@v2

    # Setup Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Cache dependencies (optional but professional)
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Install dependencies
    - name: Install dependencies
      run: pip install -r requirements.txt

    # Dependency vulnerability scan (SCA)
    - name: Run dependency scan (pip-audit)
      run: |
        pip install pip-audit
        echo "Running dependency scan..."
        pip-audit || true

    # Generate SBOM (automatically uploaded by action)
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json

    # Linting (static code quality)
    - name: Run linting (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Run tests
    - name: Run tests
      run: pytest



  # Job 2: SAST (CodeQL)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Analyze code
      uses: github/codeql-action/analyze@v4


 
  # Job 3: Build + Container Security
  build:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    needs: [test, codeql]

    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Build Docker image
    - name: Build Docker image
      run: docker build -t devsecops-app:latest .

    # Scan Docker image for vulnerabilities
    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devsecops-app:latest
        format: table
        exit-code: 0
        severity: CRITICAL,HIGH

    

  # Job 4: DAST (OWASP ZAP)


  dast:
    name: Dynamic Application Security Test
    runs-on: ubuntu-latest
    needs: build

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    # Build image again (required in this job)
    - name: Build Docker image
      run: docker build -t devsecops-app:latest .

    #  Run the application
    - name: Start application
      run: |
        docker run -d -p 8080:8080 --name app devsecops-app:latest
        sleep 10

    # Run OWASP ZAP scan
    - name: Run ZAP baseline scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8080'

    # Upload report
    - name: Upload ZAP report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: report_html.html





