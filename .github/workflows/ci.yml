name: DevSecOps Pipeline

# Minimal permissions following least-privilege principle
permissions:
  contents: read
  security-events: write
  issues: write

# Ensure JavaScript-based actions use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel older runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow triggers
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:

  # CI, code quality, and dependency security checks
  test:
    name: CI and Security Checks
    runs-on: ubuntu-latest

    steps:

      # Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan repository for exposed secrets
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2

      # Install Python runtime
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest tests.py --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html

      # Check dependencies for known vulnerabilities
      - name: Dependency Scan
        run: pip-audit --strict

      # Generate Software Bill of Materials
      - name: Generate SBOM
        uses: anchore/sbom-action@v0

      # Run static security analysis for Python
      - name: Bandit Scan
        run: bandit -r .

      # Run code quality checks
      - name: Lint Code
        run: flake8 .

      # Execute automated tests
      - name: Run Tests
        run: pytest

  # Static Application Security Testing (SAST)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

      # Checkout repository
      - uses: actions/checkout@v4

      # Initialize CodeQL analysis
      - uses: github/codeql-action/init@v4
        with:
          languages: python

      # Analyze source code
      - uses: github/codeql-action/analyze@v4

  # Build and container security validation
  build:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    needs: test

    steps:

      # Checkout repository
      - uses: actions/checkout@v4

      # Validate Dockerfile best practices
      - uses: hadolint/hadolint-action@v3

      # Configure Docker Buildx
      - uses: docker/setup-buildx-action@v3

      # Build application container image
      - uses: docker/build-push-action@v6
        with:
          push: false
          tags: devsecops-app:latest

      # Scan container image for vulnerabilities
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest

  # Dynamic Application Security Testing (DAST)
  dast:
    name: Dynamic Application Security Test
    runs-on: ubuntu-latest
    needs: [build, codeql]

    steps:

      # Checkout repository
      - uses: actions/checkout@v4

      # Build container image
      - name: Build Docker Image
        run: docker build -t devsecops-app:latest .

      # Start application container
      - name: Start Application
        run: docker run -d -p 8080:8080 devsecops-app:latest

      # Wait until application becomes available
      - name: Health Check
        run: |
          until curl -fsS http://localhost:8080
          do
            sleep 2
          done

      # Run OWASP ZAP security scan
      - uses: zaproxy/action-baseline@v0.10.0

      # Store scan report for review
      - uses: actions/upload-artifact@v4
        if: always()



